<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2c3e50"/>

  <!-- Warehouse building -->
  <g id="warehouse">
    <!-- Main building body -->
    <rect x="120" y="200" width="272" height="180" fill="#34495e" rx="8"/>

    <!-- Roof -->
    <path d="M 100 200 L 256 140 L 412 200 Z" fill="#e74c3c"/>

    <!-- Large door -->
    <rect x="200" y="260" width="112" height="120" fill="#c0392b" rx="4"/>
    <line x1="256" y1="260" x2="256" y2="380" stroke="#95a5a6" stroke-width="3"/>

    <!-- Windows -->
    <rect x="140" y="220" width="40" height="40" fill="#f39c12" rx="2"/>
    <rect x="332" y="220" width="40" height="40" fill="#f39c12" rx="2"/>

    <!-- Window panes -->
    <line x1="160" y1="220" x2="160" y2="260" stroke="#34495e" stroke-width="2"/>
    <line x1="140" y1="240" x2="180" y2="240" stroke="#34495e" stroke-width="2"/>
    <line x1="352" y1="220" x2="352" y2="260" stroke="#34495e" stroke-width="2"/>
    <line x1="332" y1="240" x2="372" y2="240" stroke="#34495e" stroke-width="2"/>
  </g>

  <!-- Red Chili (Mirchi) -->
  <g id="chili">
    <!-- Chili body (curved) -->
    <path d="M 380 320 Q 410 340 415 380 Q 418 410 405 435 Q 395 450 380 450 Q 370 450 365 440 Q 358 425 360 405 Q 362 380 375 360 Q 382 345 380 320 Z"
          fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>

    <!-- Chili stem -->
    <path d="M 380 320 Q 378 310 382 300 Q 385 295 390 297"
          fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>

    <!-- Chili highlight -->
    <ellipse cx="385" cy="360" rx="8" ry="15" fill="#ff6b6b" opacity="0.6"/>
  </g>

  <!-- SpiceIn text badge -->
  <g id="badge">
    <rect x="90" y="420" width="140" height="50" fill="#e74c3c" rx="25"/>
    <text x="160" y="452" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
          fill="white" text-anchor="middle">SpiceIn</text>
  </g>
</svg>
